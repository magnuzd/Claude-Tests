<!--
  TRENDING FINDS — Carousel component
  Self-contained: inline CSS + inline JS, no external dependencies.
  Drop into a Magento CMS block or PageBuilder HTML element.

  To customise:
    - Replace each .tf-card[href] with the real category/product URL.
    - Replace each <img src> with a real Magento media URL (and keep a descriptive alt).
    - Add/remove <li class="tf-carousel__item"> nodes freely — pagination adapts automatically.
  Class names are prefixed "tf-" to avoid collisions with Magento/theme styles.
  Supports multiple independent instances on the same page.
-->
<section class="tf-carousel" aria-roledescription="carousel" aria-label="Trending Finds">
  <style>
    .tf-carousel {
      --tf-navy: #0a2a5e;
      --tf-accent: #1f6fe0;
      --tf-gap: 16px;
      --tf-per-view: 1.2;            /* mobile: ~1 card + peek */
      --tf-card-radius: 8px;

      box-sizing: border-box;
      width: 100%;
      margin: 0;
      padding: 24px 0 32px;          /* full-bleed: no left/right gutter */
      font-family: inherit;
      color: var(--tf-navy);
    }
    .tf-carousel *,
    .tf-carousel *::before,
    .tf-carousel *::after { box-sizing: border-box; }

    .tf-carousel__title {
      margin: 0 0 20px;
      font-size: clamp(1.4rem, 2.5vw, 2rem);
      font-weight: 800;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--tf-navy);
    }

    /* Track: native horizontal scroll + snap = free touch/trackpad swipe */
    .tf-carousel__track {
      display: flex;
      gap: var(--tf-gap);
      margin: 0;
      padding: 4px 0;
      list-style: none;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;          /* Firefox */
    }
    .tf-carousel__track::-webkit-scrollbar { display: none; } /* WebKit */

    .tf-carousel__item {
      flex: 0 0 calc((100% - (var(--tf-per-view) - 1) * var(--tf-gap)) / var(--tf-per-view));
      scroll-snap-align: start;
    }

    /* Card */
    .tf-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 16px 12px;
      text-decoration: none;
      color: inherit;
      border-radius: var(--tf-card-radius);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .tf-card__media {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tf-card__media img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      object-fit: contain;
      display: block;
    }
    .tf-card__label {
      font-size: clamp(1rem, 1.6vw, 1.35rem);
      font-weight: 700;
      text-align: center;
      color: var(--tf-navy);
    }
    .tf-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(10, 42, 94, 0.12); }
    .tf-card:focus-visible {
      outline: 3px solid var(--tf-accent);
      outline-offset: 3px;
      transform: translateY(-4px);
    }

    /* Controls */
    .tf-carousel__controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
    }
    .tf-carousel__arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: transparent;
      color: var(--tf-accent);
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, opacity 0.2s ease;
    }
    .tf-carousel__arrow svg { width: 22px; height: 22px; }
    .tf-carousel__arrow:hover { background: rgba(31, 111, 224, 0.1); }
    .tf-carousel__arrow:focus-visible { outline: 3px solid var(--tf-accent); outline-offset: 2px; }
    .tf-carousel__arrow[aria-disabled="true"] {
      opacity: 0.35;
      cursor: default;
      pointer-events: none;
    }

    .tf-carousel__dots {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tf-carousel__dot {
      width: 9px;
      height: 9px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: #c7d2e2;
      cursor: pointer;
      transition: width 0.2s ease, background 0.2s ease;
    }
    .tf-carousel__dot[aria-current="true"] {
      width: 26px;
      border-radius: 6px;
      background: var(--tf-accent);
    }
    .tf-carousel__dot:focus-visible { outline: 3px solid var(--tf-accent); outline-offset: 3px; }

    /* Tablet */
    @media (min-width: 600px) {
      .tf-carousel { --tf-per-view: 2.2; }
    }
    /* Desktop: ~3 full cards + partial 4th peeking (matches design) */
    @media (min-width: 900px) {
      .tf-carousel { --tf-per-view: 3.4; --tf-gap: 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .tf-carousel__track { scroll-behavior: auto; }
      .tf-card { transition: none; }
    }
  </style>

  <h2 class="tf-carousel__title">Trending Finds</h2>

  <ul class="tf-carousel__track" role="list" tabindex="0" aria-label="Trending coins, use arrow keys to scroll">
    <li class="tf-carousel__item">
      <a class="tf-card" href="#">
        <span class="tf-card__media">
          <img src="https://placehold.co/400x400?text=Silver+Eagle" alt="2025 American Silver Eagle coin" loading="lazy" width="400" height="400">
        </span>
        <span class="tf-card__label">Silver Eagles</span>
      </a>
    </li>
    <li class="tf-carousel__item">
      <a class="tf-card" href="#">
        <span class="tf-card__media">
          <img src="https://placehold.co/400x400?text=Morgan+Dollar" alt="1921 Morgan Silver Dollar coin" loading="lazy" width="400" height="400">
        </span>
        <span class="tf-card__label">Morgan Silver Dollars</span>
      </a>
    </li>
    <li class="tf-carousel__item">
      <a class="tf-card" href="#">
        <span class="tf-card__media">
          <img src="https://placehold.co/400x400?text=Gold+Eagle" alt="2025 American Gold Eagle coin" loading="lazy" width="400" height="400">
        </span>
        <span class="tf-card__label">Gold Eagles</span>
      </a>
    </li>
    <li class="tf-carousel__item">
      <a class="tf-card" href="#">
        <span class="tf-card__media">
          <img src="https://placehold.co/400x400?text=New+Releases" alt="New release coin" loading="lazy" width="400" height="400">
        </span>
        <span class="tf-card__label">New Releases</span>
      </a>
    </li>
    <li class="tf-carousel__item">
      <a class="tf-card" href="#">
        <span class="tf-card__media">
          <img src="https://placehold.co/400x400?text=Proof+Sets" alt="Proof coin set" loading="lazy" width="400" height="400">
        </span>
        <span class="tf-card__label">Proof Sets</span>
      </a>
    </li>
    <li class="tf-carousel__item">
      <a class="tf-card" href="#">
        <span class="tf-card__media">
          <img src="https://placehold.co/400x400?text=Gold+Bars" alt="Gold bullion bar" loading="lazy" width="400" height="400">
        </span>
        <span class="tf-card__label">Gold Bars</span>
      </a>
    </li>
  </ul>

  <div class="tf-carousel__controls">
    <button type="button" class="tf-carousel__arrow tf-carousel__arrow--prev" aria-label="Previous coins">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
    </button>

    <div class="tf-carousel__dots" role="tablist" aria-label="Carousel pagination"></div>

    <button type="button" class="tf-carousel__arrow tf-carousel__arrow--next" aria-label="Next coins">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>

  <script>
    (function () {
      // Scope everything to this component instance so multiple carousels coexist.
      var root = document.currentScript.closest('.tf-carousel');
      if (!root || root.dataset.tfInit) return;
      root.dataset.tfInit = '1';

      var track = root.querySelector('.tf-carousel__track');
      var prevBtn = root.querySelector('.tf-carousel__arrow--prev');
      var nextBtn = root.querySelector('.tf-carousel__arrow--next');
      var dotsWrap = root.querySelector('.tf-carousel__dots');
      var items = Array.prototype.slice.call(track.querySelectorAll('.tf-carousel__item'));
      if (!items.length) return;

      // How many whole items fit in the viewport = items advanced per page step.
      function perPage() {
        var itemW = items[0].getBoundingClientRect().width;
        var gap = parseFloat(getComputedStyle(track).columnGap || getComputedStyle(track).gap) || 0;
        var per = Math.floor((track.clientWidth + gap) / (itemW + gap));
        return Math.max(1, per);
      }

      // Reachable scroll positions, one per page. Each item-group start is clamped to the
      // maximum scrollable offset, then collapsed groups (the trailing peek that can never
      // become a left-aligned start) are de-duplicated. This prevents a phantom extra page
      // with fractional --tf-per-view layouts on mobile.
      var targets = [];
      function computeTargets() {
        var per = perPage();
        var maxScroll = Math.max(0, track.scrollWidth - track.clientWidth);
        targets = [];
        for (var i = 0; i < items.length; i += per) {
          var pos = Math.min(items[i].offsetLeft - track.offsetLeft, maxScroll);
          if (!targets.length || Math.abs(targets[targets.length - 1] - pos) > 2) {
            targets.push(pos);
          }
        }
        if (!targets.length) targets.push(0);
      }

      var dots = [];
      function buildDots() {
        computeTargets();
        dotsWrap.innerHTML = '';
        dots = [];
        for (var i = 0; i < targets.length; i++) {
          var dot = document.createElement('button');
          dot.type = 'button';
          dot.className = 'tf-carousel__dot';
          dot.setAttribute('role', 'tab');
          dot.setAttribute('aria-label', 'Go to slide ' + (i + 1) + ' of ' + targets.length);
          (function (page) {
            dot.addEventListener('click', function () { goToPage(page); });
          })(i);
          dotsWrap.appendChild(dot);
          dots.push(dot);
        }
      }

      // Active page = the reachable target nearest the current scroll position.
      function currentPage() {
        var x = track.scrollLeft;
        var best = 0;
        var bestDist = Infinity;
        for (var i = 0; i < targets.length; i++) {
          var d = Math.abs(targets[i] - x);
          if (d < bestDist) { bestDist = d; best = i; }
        }
        return best;
      }

      function goToPage(page) {
        var index = Math.max(0, Math.min(targets.length - 1, page));
        track.scrollTo({ left: targets[index], behavior: 'smooth' });
      }

      function update() {
        var active = currentPage();
        dots.forEach(function (dot, i) {
          var on = i === active;
          dot.setAttribute('aria-current', on ? 'true' : 'false');
          dot.setAttribute('aria-selected', on ? 'true' : 'false');
        });
        // Toggle arrow availability at the ends (allow 1px tolerance).
        var atStart = track.scrollLeft <= 1;
        var atEnd = track.scrollLeft + track.clientWidth >= track.scrollWidth - 1;
        prevBtn.setAttribute('aria-disabled', atStart ? 'true' : 'false');
        nextBtn.setAttribute('aria-disabled', atEnd ? 'true' : 'false');
      }

      prevBtn.addEventListener('click', function () { goToPage(currentPage() - 1); });
      nextBtn.addEventListener('click', function () { goToPage(currentPage() + 1); });

      // Keyboard support while the track is focused.
      track.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight') { e.preventDefault(); goToPage(currentPage() + 1); }
        else if (e.key === 'ArrowLeft') { e.preventDefault(); goToPage(currentPage() - 1); }
      });

      // Keep dots/arrows in sync with scroll (incl. native swipe), throttled via rAF.
      var ticking = false;
      track.addEventListener('scroll', function () {
        if (ticking) return;
        ticking = true;
        requestAnimationFrame(function () { update(); ticking = false; });
      }, { passive: true });

      var resizeTimer;
      window.addEventListener('resize', function () {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(function () { buildDots(); update(); }, 150);
      });

      buildDots();
      update();
    })();
  </script>
</section>
