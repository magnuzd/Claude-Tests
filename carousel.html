<!-- COLLECTOR FAVORITES SLIDER -->
<style>
  /* ── Section-level theming tokens ── */
  .collector-favorites {
    --fade-width: 80px;       /* edge-fade width, both sides */
    --fade-color: #fff;       /* match the page background */
  }

  /* Visually-hidden helper for the screen-reader live region */
  .collector-favorites .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    margin: -1px;
    padding: 0;
    border: 0;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
  }

  /* ── Tile rail ── */
  .collector-favorites .slider-items-wrapper {
    display: flex;
    overflow-x: auto;
    gap: 40px;
    padding: 0;
    margin: 0;
    -ms-overflow-style: none;
    scrollbar-width: none;
    scroll-snap-type: x mandatory;
  }
  .collector-favorites .slider-items-wrapper::-webkit-scrollbar { display: none; }

  .collector-favorites .tile {
    flex: 0 0 auto;
    width: clamp(220px, 28vw, 360px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    scroll-snap-align: start;
  }
  .collector-favorites .tile img {
    width: 100%;
    height: auto;
    object-fit: contain;
    display: block;
  }
  .collector-favorites .tile h6 {
    margin-top: 12px;
    text-align: center;
    color: #0e254d;
    font-size: clamp(16px, 2vw, 18px);
    font-weight: 700;
    text-transform: capitalize;
    line-height: 1.2;
  }

  /* ── Track: edge-fade overlays only ── */
  .collector-favorites .slider-track { position: relative; }

  .collector-favorites .slider-track::before,
  .collector-favorites .slider-track::after {
    content: '';
    position: absolute;
    top: 0;
    bottom: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.25s ease;
  }
  .collector-favorites .slider-track::before {
    left: 0;
    width: var(--fade-width);
    background: linear-gradient(to right, var(--fade-color) 20%, transparent);
  }
  .collector-favorites .slider-track::after {
    right: 0;
    width: var(--fade-width);
    background: linear-gradient(to left, var(--fade-color) 20%, transparent);
  }
  .collector-favorites .slider-track.can-scroll-left::before  { opacity: 1; }
  .collector-favorites .slider-track.can-scroll-right::after  { opacity: 1; }

  /* ── Bottom controls bar: prev | dots | next ── */
  .carousel-controls {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
  }

  /* ── Nav arrows: plain chevrons, no box ── */
  .collector-favorites .nav-btn {
    flex-shrink: 0;
    padding: 4px;
    border-radius: 6px;
    display: grid;
    place-items: center;
    background: none;
    border: 0;
    color: #2B7BFF;
    cursor: pointer;
    transition:
      color   0.18s ease,
      opacity 0.18s ease;
  }
  .collector-favorites .nav-btn:hover {
    color: #1a5fd0;
  }
  .collector-favorites .nav-btn:focus-visible {
    outline: 3px solid #2B7BFF;
    outline-offset: 2px;
  }
  /* Disabled = greyed out (matching the inactive dots), still focusable */
  .collector-favorites .nav-btn[aria-disabled="true"],
  .collector-favorites .nav-btn[aria-disabled="true"]:hover {
    color: #c0c8d4;
    cursor: default;
  }
  .collector-favorites .nav-btn svg {
    width: 24px;
    height: 24px;
    stroke-width: 2;
    flex-shrink: 0;
  }

  /* ── Page indicator dots ── */
  .carousel-dots {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .carousel-dot {
    height: 8px;
    width: 8px;
    min-width: 8px;
    border-radius: 4px;
    padding: 0;
    border: none;
    background: #c0c8d4;
    cursor: pointer;
    transition:
      background 0.2s ease,
      width      0.25s ease,
      transform  0.15s ease;
  }
  .carousel-dot.active {
    width: 28px;
    background: #2B7BFF;
  }
  .carousel-dot:hover:not(.active) {
    background: #7a8598;
    transform: scale(1.2);
  }
  .carousel-dot:focus-visible {
    outline: 3px solid #2B7BFF;
    outline-offset: 3px;
  }
</style>

<section class="collector-favorites fullbleed-left"
         aria-roledescription="carousel"
         aria-label="Collector Favorites">
  <div class="align-left-to-body">

    <!-- Rail with edge-fade overlays -->
    <div class="slider-track">
      <div class="slider-items-wrapper" role="list">

        <!-- TILE 1 -->
        <a href="/us-coins/silver-eagle" class="tile" role="listitem">
          <img src="/media/wysiwyg/SilverEagles_HP_IsolatedCoin_01.png" alt="Silver Eagles" loading="lazy" width="415" height="391">
          <h6>Silver Eagles</h6>
        </a>

        <!-- TILE 2 -->
        <a href="/us-coins/vintage-silver/morgan-silver-dollar" class="tile" role="listitem">
          <img src="/media/wysiwyg/Morgans_HP_IsolatedCoin_02.png" alt="Morgan Silver Dollars" loading="lazy" width="415" height="391">
          <h6>Morgan Silver Dollars</h6>
        </a>

        <!-- TILE 3 -->
        <a href="/us-coins/gold-eagle" class="tile" role="listitem">
          <img src="/media/wysiwyg/GoldEagles_HP_IsolatedCoin_03.png" alt="Gold Eagles" loading="lazy" width="415" height="391">
          <h6>Gold Eagles</h6>
        </a>

        <!-- TILE 4 -->
        <a href="/bullion/silver-bullion" class="tile" role="listitem">
          <img src="/media/wysiwyg/SilverBullion_HP_IsolatedCoin_04.png" alt="Silver Bullion" loading="lazy" width="415" height="391">
          <h6>Silver Bullion</h6>
        </a>

        <!-- TILE 5 -->
        <a href="/new-releases" class="tile" role="listitem">
          <img src="/media/wysiwyg/NewReleases_HP_IsolatedCoin_05.png" alt="New Releases" loading="lazy" width="415" height="391">
          <h6>New Releases</h6>
        </a>

        <!-- TILE 6 -->
        <a href="/us-coins/vintage-gold" class="tile" role="listitem">
          <img src="/media/wysiwyg/VintageGold_HP_IsolatedCoin_06.png" alt="U.S. Vintage Gold" loading="lazy" width="415" height="391">
          <h6>U.S. Vintage Gold</h6>
        </a>

      </div>
    </div>

    <!-- Merged controls: prev button | dots | next button -->
    <nav class="carousel-controls" aria-label="Carousel navigation">
      <button class="nav-btn nav-prev" type="button" aria-label="Scroll to previous items" aria-disabled="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="carousel-dots" role="group" aria-label="Choose page"></div>
      <button class="nav-btn nav-next" type="button" aria-label="Scroll to next items">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </nav>

    <!-- Screen-reader announcement of the current page -->
    <div class="carousel-status visually-hidden" role="status" aria-live="polite"></div>

  </div>
</section>

<script>
(() => {
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  document.querySelectorAll('.collector-favorites').forEach(sec => {
    const rail     = sec.querySelector('.slider-items-wrapper');
    const track    = sec.querySelector('.slider-track');
    const prev     = sec.querySelector('.nav-prev');
    const next     = sec.querySelector('.nav-next');
    const dotsEl   = sec.querySelector('.carousel-dots');
    const controls = sec.querySelector('.carousel-controls');
    const statusEl = sec.querySelector('.carousel-status');
    if (!rail || !prev || !next) return;

    let dots     = [];
    let lastPage = -1;

    // ── Layout metrics, all read once per pass ──
    // Pages are aligned to whole tiles so the dots, the prev/next buttons, and the
    // actual scroll position all share a single unit and never drift apart.
    const metrics = () => {
      const tiles   = rail.children;
      const count   = tiles.length;
      const cw      = rail.clientWidth;
      const left    = rail.scrollLeft;
      const maxLeft = rail.scrollWidth - cw;

      const gap      = parseFloat(getComputedStyle(rail).columnGap) || 0;
      const tileW    = count ? tiles[0].getBoundingClientRect().width : cw;
      const unit     = tileW + gap;                                   // one tile's advance
      const perPage  = Math.max(1, Math.floor((cw + gap) / unit));    // whole tiles per view
      const pageSpan = perPage * unit;
      const pages    = Math.max(1, Math.ceil(count / perPage));

      const atStart  = left <= 2;
      const atEnd    = left >= maxLeft - 2;
      const page     = atEnd ? pages - 1
                             : Math.min(pages - 1, Math.max(0, Math.round(left / pageSpan)));

      return { pages, page, pageSpan, maxLeft, atStart, atEnd };
    };

    const scrollToLeft = (left) =>
      rail.scrollTo({ left, behavior: prefersReduced ? 'auto' : 'smooth' });

    const buildDots = (pages) => {
      if (!dotsEl || dots.length === pages) return;
      dotsEl.innerHTML = '';
      dots = Array.from({ length: pages }, (_, i) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'carousel-dot';
        btn.setAttribute('aria-label', `Page ${i + 1} of ${pages}`);
        btn.addEventListener('click', () => {
          const { pageSpan, maxLeft } = metrics();
          scrollToLeft(Math.min(i * pageSpan, maxLeft));
        });
        dotsEl.appendChild(btn);
        return btn;
      });
      if (controls) controls.style.display = pages <= 1 ? 'none' : '';
    };

    const render = () => {
      const m = metrics();
      buildDots(m.pages);

      prev.setAttribute('aria-disabled', String(m.atStart));
      next.setAttribute('aria-disabled', String(m.atEnd));

      if (track) {
        track.classList.toggle('can-scroll-left',  !m.atStart);
        track.classList.toggle('can-scroll-right', !m.atEnd);
      }

      dots.forEach((d, i) => {
        const on = i === m.page;
        d.classList.toggle('active', on);
        d.setAttribute('aria-current', on ? 'true' : 'false');
      });

      // Announce only when the page actually changes, to avoid spamming AT on scroll.
      if (statusEl && m.page !== lastPage) {
        statusEl.textContent = `Page ${m.page + 1} of ${m.pages}`;
      }
      lastPage = m.page;
    };

    // Coalesce scroll-driven work to at most once per frame (no layout thrashing).
    let frame = 0;
    const schedule = () => {
      if (frame) return;
      frame = requestAnimationFrame(() => { frame = 0; render(); });
    };

    const nudge = (dir) => {
      const { pageSpan, maxLeft } = metrics();
      const target = Math.max(0, Math.min(rail.scrollLeft + dir * pageSpan, maxLeft));
      scrollToLeft(target);
    };

    prev.addEventListener('click', () => {
      if (prev.getAttribute('aria-disabled') !== 'true') nudge(-1);
    });
    next.addEventListener('click', () => {
      if (next.getAttribute('aria-disabled') !== 'true') nudge(1);
    });

    rail.addEventListener('scroll', schedule, { passive: true });

    // Recompute when the rail itself resizes (catches container/layout changes that a
    // window resize event would miss).
    if ('ResizeObserver' in window) {
      new ResizeObserver(() => { dots = []; schedule(); }).observe(rail);
    } else {
      window.addEventListener('resize', () => { dots = []; schedule(); }, { passive: true });
    }

    // Late layout shifts (lazy images, web fonts) can change scrollWidth after init.
    window.addEventListener('load', () => { dots = []; render(); });

    requestAnimationFrame(render);
  });
})();
</script>
