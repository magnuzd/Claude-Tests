<!-- COLLECTOR FAVORITES SLIDER -->
<style>
  /* ── Design tokens ── */
  .collector-favorites {
    --cf-brand: #2B7BFF;
    --cf-ink: #0e254d;
    --cf-chevron: #2B7BFF;       /* active chevron */
    --cf-chevron-off: #c0c8d4;   /* disabled chevron */
    --cf-dot: #c0c8d4;           /* inactive page */
  }

  /* ── Tile rail ── */
  .collector-favorites .slider-items-wrapper {
    display: flex;
    overflow-x: auto;
    gap: clamp(16px, 4vw, 40px);
    padding: 0;
    margin: 0;
    -ms-overflow-style: none;
    scrollbar-width: none;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }
  .collector-favorites .slider-items-wrapper::-webkit-scrollbar { display: none; }

  .collector-favorites .tile {
    flex: 0 0 auto;
    width: clamp(220px, 28vw, 360px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    scroll-snap-align: start;
  }
  .collector-favorites .tile img {
    width: 100%;
    height: auto;
    object-fit: contain;
    display: block;
  }
  .collector-favorites .tile h6 {
    margin-top: 12px;
    text-align: center;
    color: var(--cf-ink);
    font-size: clamp(16px, 2vw, 18px);
    font-weight: 700;
    text-transform: capitalize;
    line-height: 1.2;
  }

  /* ── Pagination bar: ‹  — • •  › ── */
  .carousel-pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-top: 24px;
    min-height: 44px;
  }

  /* Bare chevrons drawn in pure CSS (no inner markup, can't be stripped) */
  .collector-favorites .nav-btn {
    appearance: none;
    background: none;
    border: 0;
    width: 44px;                   /* full touch target */
    height: 44px;
    padding: 0;
    margin: 0;
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: opacity 0.18s ease, transform 0.12s ease;
  }
  .collector-favorites .nav-btn::before {
    content: "";
    width: 12px;
    height: 12px;
    border: solid var(--cf-chevron);
    border-width: 0 0 2.5px 2.5px;     /* ⌞ corner */
    transition: border-color 0.18s ease;
  }
  .collector-favorites .nav-prev::before { transform: rotate(45deg);  margin-left: 3px; }   /* ‹ */
  .collector-favorites .nav-next::before { transform: rotate(-135deg); margin-right: 3px; }  /* › */

  @media (hover: hover) {
    .collector-favorites .nav-btn:not([disabled]):hover { transform: scale(1.12); }
  }
  .collector-favorites .nav-btn:not([disabled]):active { transform: scale(0.94); }
  .collector-favorites .nav-btn:focus-visible {
    outline: 3px solid var(--cf-brand);
    outline-offset: 2px;
    border-radius: 8px;
  }
  .collector-favorites .nav-btn[disabled] {
    cursor: default;
    pointer-events: none;
  }
  .collector-favorites .nav-btn[disabled]::before { border-color: var(--cf-chevron-off); }

  /* Page indicators */
  .carousel-dots {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .carousel-dot {
    appearance: none;
    height: 8px;
    width: 8px;
    min-width: 8px;
    box-sizing: content-box;
    padding: 18px 0;               /* invisible 44px-tall hit area */
    border: 0;
    border-radius: 999px;
    background: var(--cf-dot);
    background-clip: content-box;
    cursor: pointer;
    transition: background 0.2s ease, width 0.25s ease, transform 0.15s ease;
  }
  .carousel-dot.active {
    width: 26px;                   /* blue pill = current page */
    background: var(--cf-brand);
    background-clip: content-box;
    cursor: default;
  }
  @media (hover: hover) {
    .carousel-dot:not(.active):hover { transform: scale(1.25); }
  }
  .carousel-dot:focus-visible {
    outline: 3px solid var(--cf-brand);
    outline-offset: 3px;
  }

  /* Hide the whole bar when everything fits (single page) */
  .carousel-pagination[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    .collector-favorites .slider-items-wrapper { scroll-behavior: auto; }
    .carousel-dot,
    .collector-favorites .nav-btn { transition: none; }
  }
</style>

<section class="collector-favorites fullbleed-left"
         aria-roledescription="carousel"
         aria-label="Collector Favorites">
  <div class="align-left-to-body">

    <div class="slider-items-wrapper" role="list">

      <!-- TILE 1 -->
      <a href="/us-coins/silver-eagle" class="tile" role="listitem">
        <img src="/media/wysiwyg/SilverEagles_HP_IsolatedCoin_01.png" alt="American Silver Eagles" loading="lazy" width="415" height="391">
        <h6>Silver Eagles</h6>
      </a>

      <!-- TILE 2 -->
      <a href="/us-coins/vintage-silver/morgan-silver-dollar" class="tile" role="listitem">
        <img src="/media/wysiwyg/Morgans_HP_IsolatedCoin_02.png" alt="Morgan Silver Dollars" loading="lazy" width="415" height="391">
        <h6>Morgan Silver Dollars</h6>
      </a>

      <!-- TILE 3 -->
      <a href="/us-coins/gold-eagle" class="tile" role="listitem">
        <img src="/media/wysiwyg/GoldEagles_HP_IsolatedCoin_03.png" alt="Gold Eagles" loading="lazy" width="415" height="391">
        <h6>Gold Eagles</h6>
      </a>

      <!-- TILE 4 -->
      <a href="/bullion/silver-bullion" class="tile" role="listitem">
        <img src="/media/wysiwyg/SilverBullion_HP_IsolatedCoin_04.png" alt="Silver Bullion" loading="lazy" width="415" height="391">
        <h6>Silver Bullion</h6>
      </a>

      <!-- TILE 5 -->
      <a href="/new-releases" class="tile" role="listitem">
        <img src="/media/wysiwyg/NewReleases_HP_IsolatedCoin_05.png" alt="New Arrivals" loading="lazy" width="415" height="391">
        <h6>New Releases</h6>
      </a>

      <!-- TILE 6 -->
      <a href="/us-coins/vintage-gold" class="tile" role="listitem">
        <img src="/media/wysiwyg/VintageGold_HP_IsolatedCoin_06.png" alt="Vintage Gold" loading="lazy" width="415" height="391">
        <h6>U.S. Vintage Gold</h6>
      </a>

    </div>

    <!-- Pagination: prev chevron | page dots | next chevron -->
    <nav class="carousel-pagination" aria-label="Carousel navigation">
      <button class="nav-btn nav-prev" type="button" aria-label="Previous page"></button>
      <div class="carousel-dots"></div>
      <button class="nav-btn nav-next" type="button" aria-label="Next page"></button>
    </nav>

  </div>
</section>

<script>
(() => {
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const behavior = prefersReduced ? 'auto' : 'smooth';

  document.querySelectorAll('.collector-favorites').forEach(sec => {
    const rail   = sec.querySelector('.slider-items-wrapper');
    const prev   = sec.querySelector('.nav-prev');
    const next   = sec.querySelector('.nav-next');
    const dotsEl = sec.querySelector('.carousel-dots');
    const bar    = sec.querySelector('.carousel-pagination');
    if (!rail || !prev || !next || !dotsEl) return;

    // A "page" is one rail viewport-width of scrolling.
    const pageWidth  = () => rail.clientWidth;
    const pageCount  = () => Math.max(1, Math.ceil((rail.scrollWidth - 1) / pageWidth()));
    const activePage = () => Math.round(rail.scrollLeft / pageWidth());
    const atStart    = () => rail.scrollLeft <= 2;
    const atEnd      = () => Math.ceil(rail.scrollLeft + rail.clientWidth) >= rail.scrollWidth - 2;

    let dots = [];

    const buildDots = () => {
      const n = pageCount();
      if (dots.length === n) return;
      dotsEl.innerHTML = '';
      dots = Array.from({ length: n }, (_, i) => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'carousel-dot';
        dot.setAttribute('aria-label', `Go to page ${i + 1} of ${n}`);
        dot.addEventListener('click', () =>
          rail.scrollTo({ left: i * pageWidth(), behavior })
        );
        dotsEl.appendChild(dot);
        return dot;
      });
      if (bar) bar.hidden = n <= 1;   // nothing to paginate → hide the bar
    };

    const updateState = () => {
      const p = activePage();
      prev.disabled = atStart();
      next.disabled = atEnd();
      dots.forEach((d, i) => {
        const on = i === p;
        d.classList.toggle('active', on);
        d.setAttribute('aria-current', on ? 'true' : 'false');
      });
    };

    const update = () => { buildDots(); updateState(); };

    // One update per frame for scroll/resize bursts.
    let ticking = false;
    const requestUpdate = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => { ticking = false; update(); });
    };

    prev.addEventListener('click', () => rail.scrollBy({ left: -pageWidth(), behavior }));
    next.addEventListener('click', () => rail.scrollBy({ left:  pageWidth(), behavior }));
    rail.addEventListener('scroll', requestUpdate, { passive: true });
    window.addEventListener('resize', () => { dots = []; requestUpdate(); }, { passive: true });

    requestUpdate();
  });
})();
</script>
