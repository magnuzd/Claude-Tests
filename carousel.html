<!-- ============================================================
     COLLECTOR FAVORITES SLIDER  (self-contained, namespaced "cf-")
     IMPORTANT: remove any OLD version of this block from the page.
     ============================================================ -->
<style>
  /* ── Design tokens ── */
  .cf-fav {
    --cf-brand: #2B7BFF;
    --cf-ink: #0e254d;
    --cf-chevron: #2B7BFF;       /* active chevron */
    --cf-chevron-off: #c0c8d4;   /* disabled chevron */
    --cf-dot: #c0c8d4;           /* inactive page */
  }

  /* ── Tile rail ── */
  .cf-fav .cf-rail {
    display: flex;
    overflow-x: auto;
    gap: clamp(16px, 4vw, 40px);
    padding: 0;
    margin: 0;
    -ms-overflow-style: none;
    scrollbar-width: none;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior-x: contain;
  }
  .cf-fav .cf-rail::-webkit-scrollbar { display: none; }

  .cf-fav .cf-tile {
    flex: 0 0 auto;
    width: clamp(220px, 28vw, 360px);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    scroll-snap-align: start;
  }
  .cf-fav .cf-tile img {
    width: 100%;
    height: auto;
    object-fit: contain;
    display: block;
  }
  .cf-fav .cf-tile h6 {
    margin: 12px 0 0;
    text-align: center;
    color: var(--cf-ink);
    font-size: clamp(16px, 2vw, 18px);
    font-weight: 700;
    text-transform: capitalize;
    line-height: 1.2;
  }

  /* ── Pagination bar: ‹  ▬ •  › ── */
  .cf-fav .cf-pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 18px;
    margin-top: 24px;
    min-height: 44px;
  }
  .cf-fav .cf-pagination[hidden] { display: none; }

  /* Chevrons: two rounded bars (thick, round end-caps) drawn from the inner
     <span>. The span keeps a text glyph as a child so CMS sanitizers won't
     strip the button; the glyph itself is hidden (font-size:0). */
  .cf-fav .cf-nav {
    position: static;              /* defend against stray old absolute rules */
    appearance: none;
    background: none;
    border: 0;
    width: 44px;
    height: 44px;
    padding: 0;
    margin: 0;
    display: grid;
    place-items: center;
    cursor: pointer;
    opacity: 1;
    color: var(--cf-chevron);
    transition: transform 0.12s ease;
  }
  .cf-fav .cf-chev {
    position: relative;
    display: inline-block;
    width: 18px;
    height: 18px;
    font-size: 0;                 /* hide the fallback glyph, keep node non-empty */
  }
  .cf-fav .cf-chev::before,
  .cf-fav .cf-chev::after {
    content: "";
    position: absolute;
    top: 50%;
    width: 11px;
    height: 3.6px;
    margin-top: -1.8px;           /* vertical-center the bar (no translate) */
    border-radius: 999px;         /* rounded end-caps */
    background: currentColor;
    transition: background 0.18s ease;
  }
  /* NEXT  ">"  — both bars pivot on their shared right tip */
  .cf-fav .cf-next .cf-chev::before,
  .cf-fav .cf-next .cf-chev::after { right: 50%; transform-origin: right center; }
  .cf-fav .cf-next .cf-chev::before { transform: rotate(-45deg); }
  .cf-fav .cf-next .cf-chev::after  { transform: rotate(45deg); }
  /* PREV  "<"  — both bars pivot on their shared left tip */
  .cf-fav .cf-prev .cf-chev::before,
  .cf-fav .cf-prev .cf-chev::after { left: 50%; transform-origin: left center; }
  .cf-fav .cf-prev .cf-chev::before { transform: rotate(45deg); }
  .cf-fav .cf-prev .cf-chev::after  { transform: rotate(-45deg); }

  @media (hover: hover) {
    .cf-fav .cf-nav:not([disabled]):hover { transform: scale(1.15); }
  }
  .cf-fav .cf-nav:not([disabled]):active { transform: scale(0.92); }
  .cf-fav .cf-nav:focus-visible {
    outline: 3px solid var(--cf-brand);
    outline-offset: 2px;
    border-radius: 8px;
  }
  .cf-fav .cf-nav[disabled] {
    color: var(--cf-chevron-off);
    cursor: default;
    pointer-events: none;
  }

  /* ── Page indicators ── */
  .cf-fav .cf-dots {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .cf-fav .cf-dot {
    position: relative;
    appearance: none;
    height: 8px;
    width: 8px;
    min-width: 8px;
    padding: 0;
    margin: 0;
    border: 0;
    border-radius: 999px;          /* fully rounded dot / pill */
    background: var(--cf-dot);
    cursor: pointer;
    transition: background 0.2s ease, width 0.25s ease, transform 0.15s ease;
  }
  /* Invisible 44px-tall tap target without affecting the painted shape */
  .cf-fav .cf-dot::after {
    content: "";
    position: absolute;
    inset: -18px -4px;
  }
  .cf-fav .cf-dot.is-active {
    width: 26px;                   /* blue pill = current page */
    background: var(--cf-brand);
    cursor: default;
  }
  @media (hover: hover) {
    .cf-fav .cf-dot:not(.is-active):hover { transform: scale(1.25); }
  }
  .cf-fav .cf-dot:focus-visible {
    outline: 3px solid var(--cf-brand);
    outline-offset: 3px;
  }

  @media (prefers-reduced-motion: reduce) {
    .cf-fav .cf-rail { scroll-behavior: auto; }
    .cf-fav .cf-dot,
    .cf-fav .cf-nav { transition: none; }
  }
</style>

<section class="cf-fav fullbleed-left"
         aria-roledescription="carousel"
         aria-label="Collector Favorites">
  <div class="align-left-to-body">

    <div class="cf-rail" role="list">

      <!-- TILE 1 -->
      <a href="/us-coins/silver-eagle" class="cf-tile" role="listitem">
        <img src="/media/wysiwyg/SilverEagles_HP_IsolatedCoin_01.png" alt="American Silver Eagles" loading="lazy" width="415" height="391">

      <!-- TILE 2 -->
      <a href="/us-coins/vintage-silver/morgan-silver-dollar" class="cf-tile" role="listitem">
        <img src="/media/wysiwyg/Morgans_HP_IsolatedCoin_02.png" alt="Morgan Silver Dollars" loading="lazy" width="415" height="391">
        <h6>Morgan Silver Dollars</h6>
      </a>

      <!-- TILE 3 -->
      <a href="/us-coins/gold-eagle" class="cf-tile" role="listitem">
        <img src="/media/wysiwyg/GoldEagles_HP_IsolatedCoin_03.png" alt="Gold Eagles" loading="lazy" width="415" height="391">
        <h6>Gold Eagles</h6>
      </a>

      <!-- TILE 4 -->
      <a href="/bullion/silver-bullion" class="cf-tile" role="listitem">
        <img src="/media/wysiwyg/SilverBullion_HP_IsolatedCoin_04.png" alt="Silver Bullion" loading="lazy" width="415" height="391">

      <a href="/new-releases" class="cf-tile" role="listitem">

      <!-- TILE 6 -->
      <a href="/us-coins/vintage-gold" class="cf-tile" role="listitem">
        <img src="/media/wysiwyg/VintageGold_HP_IsolatedCoin_06.png" alt="Vintage Gold" loading="lazy" width="415" height="391">
        <h6>U.S. Vintage Gold</h6>
      </a>

    </div>

    <!-- Pagination: prev chevron | page dots | next chevron -->
    <nav class="cf-pagination" aria-label="Carousel navigation">
      <button class="cf-nav cf-prev" type="button" aria-label="Previous page"><span class="cf-chev" aria-hidden="true">&#8249;</span></button>
      <div class="cf-dots"></div>
      <button class="cf-nav cf-next" type="button" aria-label="Next page"><span class="cf-chev" aria-hidden="true">&#8250;</span></button>
    </nav>

  </div>
</section>

<script>
(() => {
  const prefersReduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const behavior = prefersReduced ? 'auto' : 'smooth';

  // Self-cleanup: remove any OLD version of this slider still on the page
  // (previous pastes used the ".collector-favorites" class). This kills the
  // stray edge chevron those versions render.
  document.querySelectorAll('.collector-favorites').forEach(el => el.remove());

  document.querySelectorAll('.cf-fav').forEach(sec => {
    const rail   = sec.querySelector('.cf-rail');
    const prev   = sec.querySelector('.cf-prev');
    const next   = sec.querySelector('.cf-next');
    const dotsEl = sec.querySelector('.cf-dots');
    const bar    = sec.querySelector('.cf-pagination');
    if (!rail || !prev || !next || !dotsEl) return;

    // A "page" is one rail viewport-width of scrolling.
    const pageWidth  = () => rail.clientWidth;
    const pageCount  = () => Math.max(1, Math.ceil((rail.scrollWidth - 1) / pageWidth()));
    const activePage = () => Math.round(rail.scrollLeft / pageWidth());
    const atStart    = () => rail.scrollLeft <= 2;
    const atEnd      = () => Math.ceil(rail.scrollLeft + rail.clientWidth) >= rail.scrollWidth - 2;

    let dots = [];

    const buildDots = () => {
      const n = pageCount();
      if (dots.length === n) return;
      dotsEl.innerHTML = '';
      dots = Array.from({ length: n }, (_, i) => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.className = 'cf-dot';
        dot.setAttribute('aria-label', `Go to page ${i + 1} of ${n}`);
        dot.addEventListener('click', () =>
          rail.scrollTo({ left: i * pageWidth(), behavior })
        );
        dotsEl.appendChild(dot);
        return dot;
      });
      if (bar) bar.hidden = n <= 1;   // nothing to paginate → hide the bar
    };

    const updateState = () => {
      const p = activePage();
      prev.disabled = atStart();
      next.disabled = atEnd();
      dots.forEach((d, i) => {
        const on = i === p;
        d.classList.toggle('is-active', on);
        d.setAttribute('aria-current', on ? 'true' : 'false');
      });
    };

    const update = () => { buildDots(); updateState(); };

    // One update per frame for scroll/resize bursts.
    let ticking = false;
    const requestUpdate = () => {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(() => { ticking = false; update(); });
    };

    prev.addEventListener('click', () => rail.scrollBy({ left: -pageWidth(), behavior }));
    next.addEventListener('click', () => rail.scrollBy({ left:  pageWidth(), behavior }));
    rail.addEventListener('scroll', requestUpdate, { passive: true });
    window.addEventListener('resize', () => { dots = []; requestUpdate(); }, { passive: true });

    requestUpdate();
  });
})();
</script>
